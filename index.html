<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRADOS BARBEARIA – Agende seu horário</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#1c1a17;--mu:#6d665c;--ac:#b8862b;--acx:#fff;--bd:#e3ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1f1d1a;--tx:#f2ede4;--mu:#a29a8c;--ac:#d4a243;--acx:#141311;--bd:#33302a}}
:root[data-theme="dark"]{--bg:#141311;--card:#1f1d1a;--tx:#f2ede4;--mu:#a29a8c;--ac:#d4a243;--acx:#141311;--bd:#33302a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:8px 0 2px;letter-spacing:.5px}
.sub{color:var(--mu);margin:0 0 20px}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:1rem;margin:0 0 12px;display:flex;gap:8px;align-items:center}
h2 span{background:var(--ac);color:var(--acx);width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:.8rem}
.grid{display:grid;gap:8px}
.opt{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;padding:12px;text-align:left;font:inherit;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.opt small{color:var(--mu);display:block}
.opt.on{border-color:var(--ac);outline:2px solid var(--ac)}
.days,.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.hours{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;text-align:center;min-width:64px}
.chip small{display:block;color:var(--mu);font-size:.72rem}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chip.on small{color:var(--acx)}
.chip:disabled{opacity:.35;cursor:not-allowed}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
.go{width:100%;border:0;background:var(--ac);color:var(--acx);padding:14px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.go:disabled{opacity:.4}
.sum{color:var(--mu);margin:0 0 10px;font-size:.92rem}
#ok{display:none;text-align:center}
</style>
</head>
<body>
<main>
<h1>PRADOS BARBEARIA 💈</h1>
<p class="sub">Escolha o serviço e o horário. A confirmação sai pelo WhatsApp.</p>

<div id="form">
<section><h2><span>1</span>Serviço</h2><div class="grid" id="serv"></div></section>
<section><h2><span>2</span>Dia</h2><div class="days" id="days"></div></section>
<section><h2><span>3</span>Horário</h2><div class="hours" id="hours"><p class="sub">Escolha um dia primeiro.</p></div></section>
<section><h2><span>4</span>Seus dados</h2>
<input id="nome" placeholder="Seu nome" autocomplete="name">
<input id="tel" placeholder="Seu WhatsApp (com DDD)" inputmode="tel" autocomplete="tel">
<p class="sum" id="sum"></p>
<button class="go" id="send" disabled>Agendar pelo WhatsApp</button>
</section>
</div>

<section id="ok"><h2 style="justify-content:center">✅ Quase lá!</h2>
<p>Se o WhatsApp não abriu, toque abaixo para enviar o pedido.</p>
<a class="go" id="again" style="display:block;text-decoration:none" target="_blank" rel="noopener">Abrir WhatsApp</a></section>
</main>
<script>
// ===== CONFIGURAÇÃO: edite aqui =====
const WHATS = "5519982096162"; // número do dono (Prado): 55 + DDD + número
const SERVICOS = [
  {n:"Corte", p:35, m:40},
  {n:"Barba", p:25, m:30},
  {n:"Corte + Barba", p:55, m:60},
  {n:"Sobrancelha", p:10, m:15}
];
const ABRE = 9, FECHA = 19, PASSO = 30; // horário de funcionamento
const FECHADO = [0]; // 0 = domingo, 6 = sábado
// ====================================

const DIAS = ["dom","seg","ter","qua","qui","sex","sáb"];
const st = {s:null, d:null, h:null};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const brl = v => "R$ " + v.toFixed(2).replace(".",",");

SERVICOS.forEach((s,i)=>{
  const b = document.createElement("button");
  b.className = "opt";
  b.innerHTML = `<span>${s.n}<small>${s.m} min</small></span><strong>${brl(s.p)}</strong>`;
  b.onclick = () => { st.s = s; [...$("serv").children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); upd(); };
  $("serv").appendChild(b);
});

const hoje = new Date();
for(let i=0;i<14;i++){
  const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()+i);
  const b = document.createElement("button");
  b.className = "chip";
  b.disabled = FECHADO.includes(d.getDay());
  b.innerHTML = `<small>${DIAS[d.getDay()]}</small>${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
  b.onclick = () => { st.d = d; st.h = null; [...$("days").children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); horas(); upd(); };
  $("days").appendChild(b);
}

function horas(){
  const box = $("hours"); box.innerHTML = "";
  const agora = new Date();
  for(let m=ABRE*60; m<FECHA*60; m+=PASSO){
    const t = `${pad(Math.floor(m/60))}:${pad(m%60)}`;
    const dt = new Date(st.d.getFullYear(), st.d.getMonth(), st.d.getDate(), Math.floor(m/60), m%60);
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.disabled = dt <= agora;
    b.onclick = () => { st.h = t; [...box.children].forEach(c=>c.classList.remove("on")); b.classList.add("on"); upd(); };
    box.appendChild(b);
  }
}

function upd(){
  const ok = st.s && st.d && st.h && $("nome").value.trim().length>1 && $("tel").value.replace(/\D/g,"").length>=10;
  $("send").disabled = !ok;
  $("sum").textContent = (st.s && st.d && st.h) ? `${st.s.n} · ${DIAS[st.d.getDay()]} ${pad(st.d.getDate())}/${pad(st.d.getMonth()+1)} às ${st.h} · ${brl(st.s.p)}` : "";
}
$("nome").oninput = upd; $("tel").oninput = upd;

$("send").onclick = () => {
  const msg = `Olá, Prados Barbearia! Quero agendar:\n• Serviço: ${st.s.n} (${brl(st.s.p)})\n• Dia: ${DIAS[st.d.getDay()]} ${pad(st.d.getDate())}/${pad(st.d.getMonth()+1)}\n• Horário: ${st.h}\n• Nome: ${$("nome").value.trim()}\n• WhatsApp: ${$("tel").value.trim()}`;
  const url = "https://wa.me/" + WHATS + "?text=" + encodeURIComponent(msg);
  $("again").href = url;
  $("form").style.display = "none"; $("ok").style.display = "block";
  window.open(url, "_blank");
};
</script>
</body>
</html>
